rubrics:
  - id: 1
    type: f2p
    text: "解释器、插件、依赖和脚本检查完成前活动环境保持不变。"
  - id: 2
    type: f2p
    text: "候选环境成功后才切换目录、元数据和命令入口。"
  - id: 3
    type: f2p
    text: "创建、安装或启动失败时最后可用环境继续可执行。"
  - id: 4
    type: f2p
    text: "并行重建只允许一个完整候选成为当前环境，失败候选不能删除成功环境。"
  - id: 5
    type: f2p
    text: "进程中止后重启会清理或继续未完成目录，不启动半环境。"
  - id: 6
    type: f2p
    text: "环境变量、矩阵选择和已存在环境复用保持原有语义。"
  - id: 7
    type: p2p
    text: "shell、run 命令和插件生命周期事件只反映当前环境。"
  - id: 8
    type: p2p
    text: "普通环境创建、删除和状态查询不回归。"
